  <style>
    :root {
      --theme-color: #2563eb;
      --text-color-base: #1e293b;
      --sidebar-width: 330px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1e293b;
    }
    .sidebar {
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      width: var(--sidebar-width);
    }
    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > a {
      font-weight: 700;
      color: #0f172a;
      font-size: 15px;
    }
    .sidebar-nav ul ul li a {
      font-size: 13.5px;
      color: #475569;
      line-height: 1.6;
      padding: 4px 0;
    }
    .sidebar-nav ul ul li a:hover {
      color: var(--theme-color);
    }
    .sidebar-nav li.active > a {
      color: var(--theme-color) !important;
      font-weight: 600;
      border-right: 3px solid var(--theme-color);
    }
    .markdown-section {
      max-width: 960px;
      padding: 30px 40px 60px 40px;
    }
    .markdown-section h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
      margin-top: 1rem;
    }
    .markdown-section h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #1e293b;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.4rem;
      margin-top: 1.8rem;
    }
    .markdown-section h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #334155;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background: #f8fafc;
      color: #334155;
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      margin: 1.2em 0;
    }
    .markdown-section code {
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      background-color: #f1f5f9;
      color: #0f172a;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9em;
    }
    .markdown-section pre > code {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .app-nav {
      position: fixed;
      top: 0;
      right: 25px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      border-top: none;
    }
    .app-nav li a {
      font-weight: 500;
      color: #334155;
    }
    .app-nav li a:hover {
      color: var(--theme-color);
    }
    /* Floating Study Button */
    .study-floating-fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 999;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff !important;
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -3px rgba(37, 99, 235, 0.4), 0 4px 10px -2px rgba(37, 99, 235, 0.2);
      text-decoration: none !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .study-floating-fab:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 16px 32px -4px rgba(37, 99, 235, 0.5);
    }
    .markdown-section img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      background: #f1f5f9;
      display: block;
      margin: 12px auto;
    }
  </style>
</head>
<body>
  <div id="app">📚 正在加载面试题库知识库...</div>

  <a href="study.html" class="study-floating-fab" title="打开专属全题库自测刷题平台">
    <span>⚡</span> <span>进入刷题自测平台</span>
  </a>

  <script>
    (function () {
      var REPO = "w402116500/agent-study";
      var ON_PAGES = /github\.io$/i.test(location.hostname);
      var CDNS = [
        "https://cdn.jsdmirror.com/gh/" + REPO + "@main/",
        "https://testingcf.jsdelivr.net/gh/" + REPO + "@main/"
      ];

      function fullyDecode(value) {
        var prev = String(value || "");
        for (var i = 0; i < 5; i++) {
          try {
            var next = decodeURIComponent(prev);
            if (next === prev) break;
            prev = next;
          } catch (e) { break; }
        }
        return prev;
      }

      function encodeAssetPath(path) {
        return fullyDecode(path).split("/").filter(Boolean).map(encodeURIComponent).join("/");
      }

      function siteBase() {
        var path = location.pathname.replace(/index\.html$/i, "");
        if (!path.endsWith("/")) path += "/";
        return location.origin + path;
      }

      function stripQueryHash(value) {
        return String(value || "").split("#")[0].split("?")[0];
      }

      function toRepoRel(src) {
        if (!src) return "";
        var abs = src;
        try { abs = new URL(src, location.href).href; } catch (e) {}
        abs = stripQueryHash(abs);
        for (var i = 0; i < CDNS.length; i++) {
          if (abs.indexOf(CDNS[i]) === 0) return fullyDecode(abs.slice(CDNS[i].length));
        }
        var base = siteBase();
        if (abs.indexOf(base) === 0) return fullyDecode(abs.slice(base.length));
        var originRoot = location.origin + "/";
        if (abs.indexOf(originRoot) === 0) {
          return fullyDecode(abs.slice(originRoot.length).replace(/^agent-study\//, ""));
        }
        if (!/^https?:/i.test(src)) return fullyDecode(src.replace(/^\.\//, "").replace(/^\//, ""));
        return "";
      }

      function rewriteMarkdownImages(content, file) {
        if (!ON_PAGES || !content) return content;
        var dir = String(file || "").replace(/[^/]+$/, "");
        return content.replace(/(!\[[^\]]*\]\()([^)\s]+)(\))/g, function (m, pre, src, post) {
          if (/^https?:/i.test(src) || src.indexOf("data:") === 0) return m;
          var rel = fullyDecode(src.replace(/^\.\//, ""));
          if (rel.charAt(0) === "/") rel = rel.slice(1);
          else if (rel.indexOf("大模型面试题/") !== 0) rel = dir + rel;
          return pre + CDNS[0] + encodeAssetPath(rel) + post;
        });
      }

      function assetUrl(rel, idx) {
        if (idx < CDNS.length) return CDNS[idx] + encodeAssetPath(rel);
        return siteBase() + encodeAssetPath(rel);
      }

      window.__ASSET_CDNS = CDNS;
      window.__ASSET_ON_PAGES = ON_PAGES;

      window.__onDocsifyImgError = function (img) {
        var rel = fullyDecode(img.getAttribute("data-rel") || "");
        if (!rel) return;
        var tried = Number(img.getAttribute("data-cdn-try") || "0") + 1;
        img.setAttribute("data-cdn-try", String(tried));
        if (tried <= CDNS.length) {
          img.src = assetUrl(rel, tried);
        }
      };

      window.__rewriteDocsifyImage = function (img) {
        img.loading = "lazy";
        img.decoding = "async";
        if (!ON_PAGES) return;
        var rel = fullyDecode(img.getAttribute("data-rel") || toRepoRel(img.getAttribute("src") || img.src || ""));
        if (!rel || /^https?:/i.test(rel) || rel.indexOf("data:") === 0) return;
        img.setAttribute("data-rel", rel);
        img.onerror = function () { window.__onDocsifyImgError(img); };
        var wanted = assetUrl(rel, 0);
        img.setAttribute("data-cdn-try", "0");
        if (fullyDecode(img.getAttribute("src") || "") !== fullyDecode(wanted) && fullyDecode(img.src || "") !== fullyDecode(wanted)) {
          img.src = wanted;
        }
      };

      window.$docsify = {
        name: "AI Agent & RAG 面试题库",
        homepage: "大模型面试题/README.md",
        basePath: ON_PAGES ? CDNS[0] : undefined,
        loadSidebar: true,
        loadNavbar: true,
        alias: {
          "/.*/_sidebar.md": "/_sidebar.md",
          "/.*/_navbar.md": "/_navbar.md"
        },
        subMaxLevel: 3,
        auto2top: true,
        notFoundPage: true,
        copyCode: {
          buttonText: "复制",
          errorText: "错误",
          successText: "已复制"
        },
        plugins: [
          function (hook, vm) {
            hook.beforeEach(function (content) {
              return rewriteMarkdownImages(content, vm.route && vm.route.file);
            });
            hook.doneEach(function () {
              document.querySelectorAll(".markdown-section img").forEach(function (img) {
                window.__rewriteDocsifyImage(img);
              });
            });
          }
        ]
      };
    })();
  </script>

</body>
