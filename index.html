    :root {
      --theme-color: #2563eb;

    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;

    .sidebar {

    .markdown-section {

    .markdown-section h1 {

    .markdown-section h2 {

    }
    .markdown-section h3 {

    }
    .markdown-section blockquote {

      color: #334155;
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      margin: 1.2em 0;
    }
    .markdown-section code {

    }
    .markdown-section pre > code {

    }
    .app-nav {
      position: fixed;
      top: 0;
      right: 25px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 0 0 12px 12px;

      border: 1px solid #e2e8f0;

    }
    .app-nav li a {
      font-weight: 500;
      color: #334155;
    }
    .app-nav li a:hover {
      color: var(--theme-color);
    }
    /* Floating Study Button */
    .study-floating-fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 999;

      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -3px rgba(37, 99, 235, 0.4), 0 4px 10px -2px rgba(37, 99, 235, 0.2);
      text-decoration: none !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .study-floating-fab:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 16px 32px -4px rgba(37, 99, 235, 0.5);
    }
    .markdown-section img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      background: #f1f5f9;
      display: block;
      margin: 12px auto;
    }

<body>
  <div id="app">📚 正在加载面试题库知识库...</div>

  <a href="study.html" class="study-floating-fab" title="打开专属全题库自测刷题平台">
    <span>⚡</span> <span>进入刷题自测平台</span>
  </a>

  <script>
    (function () {
      var REPO = "w402116500/agent-study";
      var CDNS = [
        "https://cdn.jsdmirror.com/gh/" + REPO + "@main/",
        "https://cdn.jsdelivr.net/gh/" + REPO + "@main/"
      ];

      function encodeAssetPath(path) {
        return String(path || "").split("/").map(encodeURIComponent).join("/");
      }

      function siteBase() {
        var path = location.pathname.replace(/index\.html$/i, "");
        if (!path.endsWith("/")) path += "/";
        return location.origin + path;
      }

      function toRepoRel(src) {
        if (!src) return "";
        try { src = decodeURI(src); } catch (e) {}
        var abs = src;
        try { abs = new URL(src, location.href).href; } catch (e) {}
        var base = siteBase();
        if (abs.indexOf(base) === 0) return decodeURIComponent(abs.slice(base.length).split("#")[0].split("?")[0]);
        var originRoot = location.origin + "/";
        if (abs.indexOf(originRoot) === 0) {
          var rest = abs.slice(originRoot.length);
          rest = rest.replace(/^agent-study\//, "");
          return decodeURIComponent(rest.split("#")[0].split("?")[0]);
        }
        return "";
      }

      window.__onDocsifyImgError = function (img) {
        var rel = img.getAttribute("data-rel") || "";
        if (!rel) return;
        var tried = Number(img.getAttribute("data-cdn-try") || "0") + 1;
        img.setAttribute("data-cdn-try", String(tried));
        if (tried < CDNS.length) {
          img.src = CDNS[tried] + encodeAssetPath(rel);
          return;
        }
        img.onerror = null;
        img.src = encodeAssetPath(rel);
      };

      window.__rewriteDocsifyImage = function (img) {
        img.loading = "lazy";
        img.decoding = "async";
        if (!/github\.io$/i.test(location.hostname)) return;
        if (img.getAttribute("data-cdn-try") != null) return;
        var rel = toRepoRel(img.getAttribute("src") || img.src);
        if (!rel || /^https?:/i.test(rel)) return;
        img.setAttribute("data-rel", rel);
        img.setAttribute("data-cdn-try", "0");
        img.onerror = function () { window.__onDocsifyImgError(img); };
        img.src = CDNS[0] + encodeAssetPath(rel);
      };
    })();

    window.$docsify = {
      name: "AI Agent & RAG 面试题库",
      homepage: "大模型面试题/README.md",
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: "auto",
        placeholder: "🔍 全局检索 246 道面试题...",
        noData: "未找到匹配题目",
        depth: 4
      },
      copyCode: {
        buttonText: "复制",
        errorText: "错误",
        successText: "已复制"
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            document.querySelectorAll(".markdown-section img").forEach(function (img) {
              window.__rewriteDocsifyImage(img);
            });
          });
        }
      ]
    };
  </script>
